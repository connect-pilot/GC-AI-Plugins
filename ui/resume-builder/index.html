<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoldCoast Resume Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d0d0f; --paper: #f5f3ee; --surface: #ffffff; --surface-2: #faf9f6;
  --text: #17171a; --muted: #6b6a70; --faint: #a3a1a8; --line: #e3e0d8; --line-soft: #efece6;
  --gold: #c9a24d; --gold-ink: #8a6a1f; --gold-bg: #fbf5e6; --link: #6b4f12;
  --good: #047857; --good-bg: #ecfdf5; --warn: #b45309; --warn-bg: #fff7e6; --bad: #b91c1c; --bad-bg: #fef2f2;
  --font-sans: "Inter", system-ui, sans-serif; --font-serif: "Instrument Serif", Georgia, serif;
  --shadow: 0 1px 2px rgba(20,20,30,.05), 0 8px 28px -12px rgba(20,20,30,.18);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #121214; --surface: #1c1c20; --surface-2: #232328; --text: #f2f1ee; --muted: #b9b7bf; --faint: #8f8d96;
    --line: #38373e; --line-soft: #2c2b31; --gold-ink: #e6c477; --gold-bg: #2d261a; --link: #e6c477;
    --good: #86efc4; --good-bg: #17382f; --warn: #ffd993; --warn-bg: #3c2d1e; --bad: #ffadad; --bad-bg: #48262d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--text); font: 13.5px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12px; }
.lbl { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }

/* Header */
header.hero { background: var(--ink); color: #fff; position: relative; overflow: hidden; padding-top: var(--safe-top, 0); }
header.hero::before { content: ""; position: absolute; top: -170px; left: 38%; width: 620px; height: 360px; border-radius: 50%; background: rgba(201,162,77,.2); filter: blur(120px); pointer-events: none; }
.hero-in { position: relative; padding: 16px 26px; display: flex; flex-wrap: wrap; gap: 12px 26px; align-items: center; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { height: 46px; width: 46px; filter: invert(1); }
.brand .div { width: 1px; height: 34px; background: rgba(255,255,255,.16); }
.brand h1 { font: 400 27px/1 var(--font-serif); margin: 0; letter-spacing: .01em; }
.brand p { margin: 4px 0 0; font-size: 12px; color: rgba(255,255,255,.55); }
nav.tabs { display: flex; gap: 4px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: 3px; }
nav.tabs button { border: 0; background: none; color: rgba(255,255,255,.7); padding: 6px 14px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 13px; }
nav.tabs button.on { background: #fff; color: var(--ink); }
nav.tabs .count { font-size: 11px; opacity: .65; margin-left: 4px; }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(255,255,255,.6); flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 500; border: 1px solid rgba(255,255,255,.16); color: rgba(255,255,255,.85); background: rgba(255,255,255,.05); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; }
.chip.on .dot { background: #34d399; } .chip.off .dot { background: #f59e0b; }
button.chip { cursor: pointer; }

main { padding: 22px 26px calc(40px + var(--safe-bottom, 0px)); max-width: 1440px; margin: 0 auto; }

/* Buttons & fields */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 14px; cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { border-color: var(--faint); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #17120a; }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
.btn.lg { padding: 11px 20px; font-size: 14px; border-radius: 10px; }
@media (prefers-color-scheme: dark) { .btn.primary { background: #f2f1ee; color: #111; border-color: #f2f1ee; } }
.field { display: grid; gap: 5px; }
.field > span { font-size: 12px; font-weight: 500; color: var(--muted); }
input.in, textarea.in, select.in { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 11px; font-size: 13.5px; }
input.in:focus, textarea.in:focus, select.in:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,77,.18); }
textarea.in { resize: vertical; min-height: 70px; line-height: 1.5; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .row2 { grid-template-columns: 1fr; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.notice { border-radius: 10px; padding: 10px 12px; font-size: 12.5px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.bad { background: var(--bad-bg); color: var(--bad); }
.notice.good { background: var(--good-bg); color: var(--good); }
.notice.gold { background: var(--gold-bg); color: var(--gold-ink); }
.spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* New resume */
.new-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 22px; align-items: start; }
@media (max-width: 980px) { .new-grid { grid-template-columns: 1fr; } }
.intake { padding: 6px 0 0; }
.intake-head { padding: 16px 22px 6px; }
.intake-head h2 { font: 400 26px/1.1 var(--font-serif); margin: 0; }
.intake-head p { margin: 6px 0 0; color: var(--muted); }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 14px; padding: 16px 22px; border-top: 1px solid var(--line-soft); }
.step:first-of-type { border-top: 0; }
.step .n { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.step.done .n { background: var(--ink); border-color: var(--ink); color: #fff; }
@media (prefers-color-scheme: dark) { .step.done .n { background: var(--gold); border-color: var(--gold); color: #111; } }
.step h3 { margin: 3px 0 10px; font-size: 14px; font-weight: 600; }
.step h3 small { font-weight: 400; color: var(--faint); margin-left: 6px; }
.step .body { display: grid; gap: 12px; min-width: 0; }
.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; cursor: pointer; background: var(--surface-2); transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--gold); background: var(--gold-bg); }
.drop b { display: block; font-size: 14px; margin-bottom: 3px; }
.file { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); }
.file .ic { width: 38px; height: 46px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--gold-ink); flex: none; }
.file .meta { flex: 1; min-width: 0; }
.file .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer; background: var(--surface); font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.pill input { display: none; }
.pill.on { border-color: var(--ink); background: var(--ink); color: #fff; }
@media (prefers-color-scheme: dark) { .pill.on { background: var(--gold); border-color: var(--gold); color: #111; } }
.pill .num { font-size: 11px; opacity: .6; }
.intake-foot { display: flex; align-items: center; gap: 14px; padding: 16px 22px 20px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.intake-foot .hint { flex: 1; min-width: 200px; font-size: 12px; color: var(--muted); }
.side { display: grid; gap: 16px; }
.side .card { padding: 16px 18px; }
.side h4 { margin: 0 0 10px; font: 400 20px/1.1 var(--font-serif); }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: how; }
.how li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 12.5px; color: var(--muted); }
.how li::before { counter-increment: how; content: counter(how); width: 20px; height: 20px; border-radius: 50%; background: var(--gold-bg); color: var(--gold-ink); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.how li b { color: var(--text); font-weight: 600; }
.building { display: grid; gap: 12px; padding: 22px; }
.building .big { display: flex; align-items: center; gap: 12px; font: 400 22px/1.2 var(--font-serif); }
pre.msg { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 12px; margin: 0; max-height: 260px; overflow: auto; }

/* Lists */
.list { display: grid; }
.item { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line-soft); cursor: pointer; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .pos, .item .when { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .acts { display: flex; gap: 6px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; border-radius: 999px; padding: 2px 8px; background: var(--good-bg); color: var(--good); font-weight: 500; }
.mini .item { grid-template-columns: minmax(0, 1fr) auto; padding: 9px 4px; }
.lib-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.lib-head h2 { font: 400 28px/1 var(--font-serif); margin: 0; }
.lib-head input { max-width: 320px; margin-left: auto; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
@media (max-width: 720px) { .item { grid-template-columns: 1fr auto; } .item .pos, .item .when { display: none; } }

/* Build view */
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.bar .title { flex: 1; min-width: 220px; }
.bar .title h2 { font: 400 28px/1.05 var(--font-serif); margin: 0; }
.bar .title p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
.bar .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.build-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 22px; align-items: start; }
@media (max-width: 1100px) { .build-grid { grid-template-columns: 1fr; } }
.paper-wrap { overflow-x: auto; padding-bottom: 6px; }
.paper-hint { font-size: 12px; color: var(--muted); margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }

/* The page preview: always paper-white, sized like US Letter at 96px/in (816px). */
.paper { --pt: 1.3333px; width: 816px; min-height: 1056px; margin: 0 auto; background: #fff; color: #000; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 18px 50px -20px rgba(0,0,0,.35);
  font-family: Helvetica, Arial, sans-serif; font-size: calc(10 * var(--pt)); line-height: calc(13 * var(--pt)); padding: calc(133.2 * var(--pt)) calc(60 * var(--pt)) calc(70 * var(--pt)); color-scheme: light; }
.paper::before { content: ""; position: absolute; inset: calc(28.8 * var(--pt)); border: 1px solid #000; pointer-events: none; }
.paper .lh-logo { position: absolute; left: calc(54 * var(--pt)); top: calc(32.4 * var(--pt)); width: calc(75.6 * var(--pt)); height: calc(75.6 * var(--pt)); }
.paper .lh-contact { position: absolute; right: calc(54 * var(--pt)); top: calc(43 * var(--pt)); text-align: right; font-size: calc(11 * var(--pt)); line-height: calc(16 * var(--pt)); }
.paper .lh-rule { position: absolute; left: calc(54 * var(--pt)); right: calc(54 * var(--pt)); top: calc(126 * var(--pt)); border-top: 1px solid #000; }
.paper .foot { position: absolute; left: 0; right: 0; bottom: calc(30 * var(--pt)); text-align: center; font-size: calc(8 * var(--pt)); }
.paper .nm { text-align: center; font-weight: 700; font-size: calc(18 * var(--pt)); line-height: calc(22 * var(--pt)); margin-bottom: calc(2 * var(--pt)); }
.paper .pa { text-align: center; font-size: calc(11 * var(--pt)); line-height: calc(14 * var(--pt)); color: #333; margin-bottom: calc(14 * var(--pt)); }
.paper .sh { font-weight: 700; font-size: calc(11 * var(--pt)); line-height: calc(14 * var(--pt)); margin-top: calc(10 * var(--pt)); padding-bottom: calc(2 * var(--pt)); border-bottom: 1px solid #000; margin-bottom: calc(4 * var(--pt)); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.paper .sh .tools { margin-left: auto; }
.paper p { margin: 0 0 calc(6 * var(--pt)); }
.paper .grid2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(10 * var(--pt)); padding-left: calc(6 * var(--pt)); }
.paper .bl { position: relative; padding-left: calc(12 * var(--pt)); margin-bottom: calc(2 * var(--pt)); }
.paper .bl::before { content: "•"; position: absolute; left: 0; }
.paper .bl.ind { margin-left: calc(6 * var(--pt)); }
.paper .rowlr { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
.paper .ttl { font-weight: 700; margin-bottom: calc(2 * var(--pt)); }
.paper .ttl .sfx { font-weight: 400; }
.paper .co { margin-bottom: calc(12 * var(--pt)); }
.paper .muted-line { color: #555; }
/* Inline editing */
.paper [contenteditable] { outline: none; border-radius: 3px; transition: background .12s, box-shadow .12s; min-width: 1ch; }
.paper [contenteditable]:hover { background: rgba(201,162,77,.12); }
.paper [contenteditable]:focus { background: rgba(201,162,77,.18); box-shadow: 0 0 0 2px rgba(201,162,77,.55); }
.paper [contenteditable]:empty::before { content: attr(data-ph); color: #aaa; }
.paper .x { visibility: hidden; border: 0; background: #fff; color: #b91c1c; cursor: pointer; font-size: 13px; line-height: 1; padding: 0 4px; position: absolute; right: -22px; top: 0; font-family: var(--font-sans); }
.paper .bl:hover > .x, .paper .edu:hover > .x { visibility: visible; }
.paper .add { border: 1px dashed #d6cfbf; background: #fffdf7; color: #8a6a1f; font: 500 11px var(--font-sans); border-radius: 6px; padding: 1px 8px; cursor: pointer; margin: 2px 0 6px calc(12 * var(--pt)); opacity: 0; transition: opacity .15s; }
.paper:hover .add { opacity: 1; }
.paper .sec { position: relative; }

/* Side panel */
.panel { position: sticky; top: 14px; overflow: hidden; }
.ptabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.ptabs button { flex: 1; border: 0; background: none; padding: 11px 6px; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; }
.ptabs button.on { color: var(--text); border-bottom-color: var(--gold); background: var(--surface); }
.pbody { padding: 16px; display: grid; gap: 12px; max-height: calc(100vh - 140px - var(--safe-bottom, 0px)); overflow: auto; }
.pbody h5 { margin: 4px 0 0; font-size: 12px; font-weight: 600; }
.review ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 12.5px; }
.review .flag li { color: var(--warn); }
.attach { display: flex; gap: 14px; font-size: 12.5px; align-items: center; flex-wrap: wrap; }
.attach label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.order { display: grid; gap: 6px; }
.order .o { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px 6px 10px; background: var(--surface-2); font-size: 12.5px; }
.order .o.off { opacity: .5; }
.order .o span { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.chips button:hover { border-color: var(--gold); }
.drafts { display: grid; gap: 4px; font-size: 12px; }

.savebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + var(--safe-bottom, 0px)); background: var(--ink); color: #fff; border-radius: 12px; padding: 9px 10px 9px 16px; display: flex; gap: 10px; align-items: center; box-shadow: 0 12px 40px -10px rgba(0,0,0,.5); z-index: 20; font-size: 13px; }
.savebar .btn { border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; }
.savebar .btn.gold { background: var(--gold); color: #17120a; border-color: var(--gold); }
#toast { position: fixed; top: calc(14px + var(--safe-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 30; display: grid; gap: 8px; }
#toast .t { background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 14px; font-size: 13px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
#toast .t.bad { background: #7f1d1d; }
.loading { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 60px; color: var(--muted); }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div class="brand">
      <img id="logo" alt="GoldCoast Search Group">
      <div class="div"></div>
      <div><h1>Resume Builder</h1><p id="company">Presentation resumes</p></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="new" type="button">New resume</button>
      <button data-view="library" type="button">Resumes<span class="count" id="count"></span></button>
    </nav>
    <div class="who" id="who"></div>
  </div>
</header>
<main id="main"><div class="loading"><span class="spinner"></span> Loading the Resume Builder…</div></main>
<div id="toast"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
